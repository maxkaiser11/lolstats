<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen flex flex-col bg-slate-950 text-slate-200 font-sans">
  <!-- Nav -->
  <header class="border-b border-slate-800/80">
    <nav class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="/home" class="text-lg font-bold tracking-tight">
        lol<span class="text-amber-400">stats</span>
      </a>
      <div class="flex items-center gap-2">
        {{if .User}}
          <a href="/accounts">My Accounts</a>
          <form method="POST" action="/logout">
            <button class="px-6 py-3 font-semibold text-slate-950 bg-amber-400 rounded-lg hover:bg-amber-300 cursor-pointer transition-colors">
              Logout</button>
          </form>
          {{else}}
        <a href="/login" class="px-4 py-2 text-sm text-slate-300 hover:text-white transition-colors">Log in</a>
        <a href="/signup" class="px-4 py-2 text-sm font-semibold text-slate-950 bg-amber-400 rounded-md hover:bg-amber-300 transition-colors">Sign up</a>
        {{end}}
      </div>
    </nav>
  </header>
    <main class="max-w-3xl mx-auto px-4 py-12 flex-1">
      <h1 class="text-2xl font-bold text-white">My accounts</h1>

      <form method="POST" action="/accounts" class="mt-6 flex gap-3">
        <input name="name" placeholder="Game name" required
          class="flex-1 px-4 py-2 bg-slate-900 border border-slate-800 rounded-lg focus:outline-none focus:border-amber-400">
        <input name="tag" placeholder="EUW" required maxlength="5"
          class="w-24 px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg uppercase focus:outline-none focus:border-amber-400">
        <button class="px-5 py-2 font-semibold text-slate-950 bg-amber-400 rounded-lg hover:bg-amber-300 cursor-pointer">Add</button>
      </form>

      <ul class="mt-8 space-y-2">
        {{range .Accounts}}
        <li class="flex items-center justify-between p-4 bg-slate-900 border border-slate-800 rounded-lg">
          <a href="/matches/{{.GameName}}/{{.TagLine}}" class="font-medium text-white hover:text-amber-400">
            {{.GameName}} <span class="text-slate-500">#{{.TagLine}}</span>
          </a>
          <form method="POST" action="/accounts/{{.ID}}/delete">
            <button class="text-sm text-slate-500 hover:text-red-400 cursor-pointer">Remove</button>
          </form>
        </li>
        {{else}}
        <li class="text-slate-500">No saved accounts yet.</li>
        {{end}}
      </ul>
    </main>
  </body>
</html>
