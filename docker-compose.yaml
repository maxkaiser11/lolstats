services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lolstats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lolstats"]
      interval: 2s
      timeout: 2s
      retries: 10
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: postgres://postgres:postgres@db:5432/lolstats?sslmode=disable
      RIOT_API_KEY: ${RIOT_API_KEY}
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections
volumes:
  pgdata:
